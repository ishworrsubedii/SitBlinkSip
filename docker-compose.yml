services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Persists the SQLite database on the host across rebuilds/restarts.
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The browser (not the container) talks to the backend, so this must be
        # an address reachable from the host machine, not the Docker-internal
        # service name — "backend:8000" would not resolve from your browser.
        NEXT_PUBLIC_API_BASE_URL: localhost:8000
        NEXT_PUBLIC_WS_PREFIX: "ws://"
        NEXT_PUBLIC_HTTP_PREFIX: "http://"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
