<svg width="120" height="160" viewBox="0 0 120 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Vertical Guide Line -->
  <line x1="60" y1="10" x2="60" y2="150" 
    stroke="#3B82F6" 
    stroke-width="2" 
    stroke-dasharray="4 4"
  >
    <animate
      attributeName="stroke-dashoffset"
      values="0;8"
      dur="1s"
      repeatCount="indefinite"
    />
  </line>
  
  <!-- Shoulder Level -->
  <g transform="translate(20, 40)">
    <line x1="0" y1="0" x2="80" y2="0" 
      stroke="#3B82F6" 
      stroke-width="2" 
      stroke-dasharray="4 4"
    />
    <text x="85" y="5" fill="#3B82F6" font-size="12">Shoulders</text>
  </g>
  
  <!-- Back Angle -->
  <path d="M60 40 L60 120" 
    stroke="#3B82F6" 
    stroke-width="3"
    stroke-linecap="round"
  >
    <animate
      attributeName="d"
      values="M60 40 L60 120;M60 40 L65 120;M60 40 L60 120"
      dur="4s"
      repeatCount="indefinite"
    />
  </path>
  
  <!-- Angle Indicator -->
  <circle cx="60" cy="80" r="3" fill="#3B82F6">
    <animate
      attributeName="r"
      values="3;4;3"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>
</svg>
